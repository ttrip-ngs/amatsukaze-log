# Amatsukaze Log Collector - 本番環境
#
# 外部のLoki/Grafanaサーバーを使用する構成
#
# 使用方法:
#   # 環境変数で外部Lokiを指定
#   export LOKI_ENDPOINT=http://your-loki-server:3100
#   docker compose up -d
#
# サービス構成:
#   - collector: ログ収集・パース・ファイル出力
#   - vector: ログファイル読み取り → 外部Loki/Vector送信
#   - rsyslogd: CRITICALログ → Zabbix連携

services:
  # Amatsukaze Log Collector
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amatsukaze-collector
    restart: unless-stopped
    volumes:
      # 設定ファイル
      - ./config/config.yaml:/app/config/config.yaml:ro
      # Amatsukazeログディレクトリ（ホストのパスに変更してください）
      - /path/to/amatsukaze/logs:/var/log/amatsukaze:ro
      # 処理済みDB永続化
      - collector-data:/data
    environment:
      - LOG_LEVEL=INFO
      - CONFIG_PATH=/app/config/config.yaml
    depends_on:
      - vector
      - rsyslogd
    networks:
      - amatsukaze-net
    command: ["python", "-m", "src.main"]

  # rsyslogd (CRITICALログ → Zabbix連携)
  rsyslogd:
    image: rsyslog/syslog_appliance_alpine:latest
    container_name: amatsukaze-rsyslog
    restart: unless-stopped
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - ./config/rsyslog.conf:/etc/rsyslog.conf:ro
      - collector-data:/data:ro
      - rsyslog-logs:/var/log
    networks:
      - amatsukaze-net

  # Vector (ログルーター: Collector → 外部Loki/Vector)
  vector:
    image: timberio/vector:latest-alpine
    container_name: amatsukaze-vector
    restart: unless-stopped
    ports:
      - "9000:9000"  # API endpoint
    volumes:
      - ./config/vector.toml:/etc/vector/vector.toml:ro
      - collector-data:/data:ro
    environment:
      # 外部Lokiエンドポイント（環境変数で設定）
      - LOKI_ENDPOINT=${LOKI_ENDPOINT:-http://loki:3100}
      # 外部Vectorエンドポイント（Vector経由の場合）
      - VECTOR_ENDPOINT=${VECTOR_ENDPOINT:-vector-server:9000}
    networks:
      - amatsukaze-net

volumes:
  collector-data:
    driver: local
  rsyslog-logs:
    driver: local

networks:
  amatsukaze-net:
    driver: bridge
