# rsyslog Configuration for Amatsukaze Log Collector
#
# collectorが書き込んだsyslogファイルを読み取り、Zabbix等に転送
#
# 参考:
#   - https://www.rsyslog.com/doc/master/configuration/index.html
#   - https://www.rsyslog.com/doc/master/configuration/modules/imfile.html

# ========================================
# Global Directives
# ========================================

# 動作モード設定
$ModLoad imuxsock  # ローカルソケット対応
$ModLoad imklog    # カーネルログ対応

# メッセージフォーマット設定
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# メインキューサイズ
$MainMsgQueueSize 10000

# ========================================
# Modules
# ========================================

# ファイル入力モジュール（collectorが書き込んだsyslogファイルを読み取り）
module(load="imfile" PollingInterval="5")

# ネットワーク入力モジュール（オプション: 他システムからのsyslog受信）
module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# ========================================
# Input: collectorが書き込んだsyslogファイル
# ========================================

# amatsukaze CRITICALログファイルを読み取り
input(type="imfile"
      File="/data/logs/syslog/amatsukaze-critical.log"
      Tag="amatsukaze"
      Severity="critical"
      Facility="local0"
      PersistStateInterval="1")

# ========================================
# Templates
# ========================================

# Zabbix向けフォーマット（RFC 3164準拠）
template(name="ZabbixFormat" type="string"
         string="<%pri%>%timestamp% %hostname% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# デバッグ用詳細フォーマット
template(name="DebugFormat" type="string"
         string="%timestamp% %hostname% %syslogtag% %msg%\n")

# ========================================
# Rules
# ========================================

# CRITICALログをZabbixに転送（Zabbixサーバーアドレスに変更してください）
# *.crit @@zabbix-server:10514;ZabbixFormat

# CRITICALログをローカルファイルに保存（デバッグ用）
*.crit /var/log/amatsukaze-critical.log;DebugFormat

# すべてのamatsukazeログをローカルファイルに保存（オプション）
# :syslogtag, contains, "amatsukaze" /var/log/amatsukaze-all.log;DebugFormat

# ========================================
# Local Logs
# ========================================

# 標準的なsyslogファイル保存
auth,authpriv.*         /var/log/auth.log
*.*;auth,authpriv.none  -/var/log/syslog
kern.*                  -/var/log/kern.log

# ========================================
# Discard Rules
# ========================================

# 不要なログを破棄（必要に応じてコメントアウト）
# :msg, contains, "some-noisy-message" stop

# ========================================
# Drop Privileges (セキュリティ強化)
# ========================================
$PrivDropToUser syslog
$PrivDropToGroup adm
